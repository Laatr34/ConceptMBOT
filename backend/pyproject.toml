[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robotlab-backend"
version = "0.2.0"
description = "RobotLab Web backend: calculation engines and API"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.6",
  "sqlalchemy>=2.0",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4", "mypy>=1.9"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
